<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunday Notes | Lakeview Assembly</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-49YV87CD4W"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-49YV87CD4W');
  </script>

  <!-- Weekly destination -->
  <script src="config.js"></script>

</head>

<body>

<script>

  const destination = weeklyLinks.youversionNotes;

  let redirected = false;

  function goToNotes() {

    if (redirected) return;

    redirected = true;

    window.location.replace(destination);
  }


  /* Send Church Center action to GA4 */

  gtag('event', 'cc_youversion_notes_click', {

    event_category: 'church_center_action',

    event_title: 'YouVersion Notes',

    action_type: 'youversion_notes',

    source_location: 'church_center',

    destination_url: destination,

    transport_type: 'beacon',

    event_callback: goToNotes

  });


  /* Fallback so visitor is never stuck */

  setTimeout(goToNotes, 1200);

</script>


<div style="
  font-family: Arial, sans-serif;
  text-align: center;
  padding-top: 80px;
">

  <h2>Opening Sunday Notes...</h2>

  <p>Please wait while we take you to this week's notes.</p>

</div>

</body>
</html>
