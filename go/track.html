<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lakeview Assembly</title>

  <!-- Destination list -->
  <script src="links.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-49YV87CD4W"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-49YV87CD4W', {
      send_page_view: false
    });
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #082f5b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .message {
      padding: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    p {
      margin: 0;
      font-size: 18px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1 id="title">Lakeview Assembly</h1>
    <p id="status">Opening...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const item =
      typeof links !== 'undefined' && id
        ? links[id]
        : null;

    if (!item) {

      document.getElementById('title').textContent =
        'Link Not Found';

      document.getElementById('status').textContent =
        'This Lakeview link is not currently available.';

    } else {

      document.title =
        item.name + ' | Lakeview Assembly';

      document.getElementById('title').textContent =
        item.name;

      document.getElementById('status').textContent =
        'Opening...';

      window.addEventListener('load', function () {

        console.log(
          'Sending GA4 event:',
          item.event
        );

        /*
         * Simple GA4 event.
         * This matches the manual test that worked.
         */

        gtag('event', item.event, {
          debug_mode: true
        });

        /*
         * Give GA4 time to send the event,
         * then redirect to the destination.
         */

        setTimeout(function () {

          console.log(
            'Redirecting to:',
            item.url
          );

          window.location.replace(item.url);

        }, 3000);

      });

    }
  </script>

</body>
</html>
