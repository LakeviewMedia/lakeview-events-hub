<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lakeview Assembly</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-49YV87CD4W"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-49YV87CD4W', {
      send_page_view: false
    });
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #082f5b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .message {
      padding: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    p {
      margin: 0;
      font-size: 18px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1 id="title">Lakeview Assembly</h1>
    <p id="status">Opening...</p>
  </div>

  <script>
    const links = {

      connect: {
        name: "Connect Card",
        url: "https://ourlakeviewchurch.churchcenter.com/people/forms/946726",
        event: "cc_connect_card_click"
      },

      notes: {
        name: "YouVersion Notes",
        url: "http://bible.com/events/49656593",
        event: "cc_youversion_notes_click"
      },

      timeapart: {
        name: "Time Apart Registration",
        url: "https://brushfire.com/ohioministry/timeapart2026/628586/register",
        event: "cc_time_apart_registration_click"
      },

      riverchurch: {
        name: "The River Church Event Registration",
        url: "https://www.theriverchurch.church/events?sapurl=LyttdnBkL2xiL2V2Lys5ODRmYjVuL3JlZ2lzdGVyP2JyYW5kaW5nPXRydWUmZW1iZWQ9dHJ1ZSZyZWNlbnRSb3V0ZT1hcHAud2ViLWFwcC5saWJyYXJ5LmNhbGVuZGFyJnJlY2VudFJvdXRlU2x1Zz0lMkJwdzR0czJj",
        event: "cc_river_church_registration_click"
      },

      "950846": {
        name: "I Said YES",
        url: "https://ourlakeviewchurch.churchcenter.com/people/forms/950846",
        event: "cc_i_said_yes_click"
      },

      "952793": {
        name: "Join A Team",
        url: "https://ourlakeviewchurch.churchcenter.com/people/forms/952793",
        event: "cc_join_a_team_click"
      }

    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const item = id ? links[id] : null;

    if (!item) {

      document.getElementById('title').textContent =
        'Link Not Found';

      document.getElementById('status').textContent =
        'This Lakeview link is not currently available.';

    } else {

      document.title =
        item.name + ' | Lakeview Assembly';

      document.getElementById('title').textContent =
        item.name;

      document.getElementById('status').textContent =
        'Opening...';

      window.addEventListener('load', function () {

        console.log(
          'Sending GA4 event:',
          item.event
        );

        gtag('event', item.event, {
          debug_mode: true
        });

        setTimeout(function () {

          console.log(
            'Redirecting to:',
            item.url
          );

          window.location.replace(item.url);

        }, 3000);

      });

    }
  </script>

</body>
</html>
