<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lakeview Assembly</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-49YV87CD4W"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-49YV87CD4W');
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #082f5b;
      color: white;
      text-align: center;
    }

    .message {
      padding: 30px;
    }
  </style>
</head>

<body>

  <div class="message">
    <h1 id="title">Lakeview Assembly</h1>
    <p id="status">Opening...</p>
  </div>

  <script>

    const trackedLinks = {

      notes: {
        destination: "http://bible.com/events/49656593",
        event: "cc_youversion_notes_click",
        title: "YouVersion Notes",
        action: "sermon_notes"
      },

      connect: {
        destination: "https://ourlakeviewchurch.churchcenter.com/people/forms/946726",
        event: "cc_connect_card_click",
        title: "Connect Card",
        action: "connect_card"
      },

      timeapart: {
        destination: "https://brushfire.com/ohioministry/timeapart2026/628586/register",
        event: "cc_time_apart_registration_click",
        title: "Time Apart Registration",
        action: "registration"
      }

    };

    const params = new URLSearchParams(window.location.search);
    const linkID = params.get('id');

    const link = trackedLinks[linkID];

    if (!link) {

      document.getElementById('title').textContent = 'Link Not Found';
      document.getElementById('status').textContent =
        'This Lakeview link is not currently available.';

    } else {

      document.title = link.title + ' | Lakeview Assembly';

      document.getElementById('title').textContent = link.title;
      document.getElementById('status').textContent = 'Opening...';

      let redirected = false;

      function redirectNow() {
        if (redirected) return;

        redirected = true;

        window.location.href = link.destination;
      }

      gtag('event', link.event, {

        event_category: 'church_center_action',

        event_title: link.title,

        action_type: link.action,

        source_location: 'church_center',

        destination_url: link.destination,

        tracking_id: linkID,

        transport_type: 'beacon'

      });

      setTimeout(redirectNow, 800);

    }

  </script>

</body>
</html>
