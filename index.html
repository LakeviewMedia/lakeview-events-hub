<meta charset="UTF-8">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-49YV87CD4W"></script>

<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());

  gtag('config', 'G-49YV87CD4W', {
    page_title: 'Lakeview Events | Lakeview Assembly'
  });
</script>


<style>

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f6f8fb;
    color: #18324a;
    text-align: center;
    padding: 60px 20px;
  }

  h1 {
    color: #082f5b;
    font-size: clamp(30px, 5vw, 44px);
    margin: 0 0 10px;
  }

  p {
    color: #667788;
    font-size: 17px;
    margin: 0 0 34px;
  }

  .month-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 360px;
    margin: 0 auto;
  }

  .month-link {
    display: block;

    background: #ffffff;

    border:
      1px solid rgba(8,47,91,.08);

    border-radius: 10px;

    padding: 16px 20px;

    text-decoration: none;

    color: #082f5b;

    font-weight: 800;
    font-size: 17px;

    box-shadow:
      0 6px 18px rgba(0,0,0,.06);

    transition:
      transform .15s ease,
      box-shadow .15s ease;
  }

  .month-link:hover {
    transform: translateY(-2px);

    box-shadow:
      0 10px 24px rgba(0,0,0,.10);
  }

</style>

</head>

<body>

  <h1>
    Lakeview Events
  </h1>

  <p>
    Lakeview Assembly of God &bull; Lake Milton, Ohio
  </p>


  <div class="month-list">

    <!-- SEPTEMBER -->

    <a
      class="month-link"
      href="september.html"
      data-ga-month="September"
    >
      September Events
    </a>


    <!-- OCTOBER

    <a
      class="month-link"
      href="october.html"
      data-ga-month="October"
    >
      October Events
    </a>

    -->


    <!-- NOVEMBER

    <a
      class="month-link"
      href="november.html"
      data-ga-month="November"
    >
      November Events
    </a>

    -->


    <!-- DECEMBER

    <a
      class="month-link"
      href="december.html"
      data-ga-month="December"
    >
      December Events
    </a>

    -->

  </div>


<!-- =====================================
     MONTH CLICK TRACKING
====================================== -->

<script>

document.addEventListener('DOMContentLoaded', function() {

  const monthLinks =
    document.querySelectorAll('[data-ga-month]');

  monthLinks.forEach(function(link) {

    link.addEventListener('click', function(event) {

      event.preventDefault();

      const monthName =
        this.dataset.gaMonth;

      const destination =
        this.href;

      /*
        Example:

        September
        becomes

        september_month_page_click
      */

      const gaEventName =
        monthName
          .toLowerCase()
          .replace(/\s+/g, '_')
        + '_month_page_click';


      gtag('event', gaEventName, {

        month_name:
          monthName,

        link_text:
          this.innerText.trim(),

        link_url:
          destination

      });


      console.log(
        'GA4 Month Event Sent:',
        gaEventName
      );


      /*
        Small delay gives GA4 time
        to send the event before
        opening the month page.
      */

      setTimeout(function() {

        window.location.href =
          destination;

      }, 300);

    });

  });

});

</script>


</body>
</html>
